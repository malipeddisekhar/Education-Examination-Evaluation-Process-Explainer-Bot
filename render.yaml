services:
  - type: web
    name: Education-Examination-Explainer-Bot
    env: python
    plan: free
    buildCommand: "apt-get update && apt-get install -y poppler-utils tesseract-ocr && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port=$PORT --server.address=0.0.0.0"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.11"
