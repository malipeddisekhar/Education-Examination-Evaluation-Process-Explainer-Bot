[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[server]
port = 8501
headless = true
runOnSave = true
enableXsrfProtection = true
maxUploadSize = 200
enableCORS = false

[browser]
serverAddress = "0.0.0.0"
gatherUsageStats = false

[ui]
hideTopBar = false
hideSidebarNav = false

[logger]
level = "info"
