[theme]
primaryColor = "#10a37f"
backgroundColor = "#212121"
secondaryBackgroundColor = "#2f2f2f"
textColor = "#ececec"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "viewer"

[server]
fileWatcherType = "none"
headless = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[logger]
level = "warning"
